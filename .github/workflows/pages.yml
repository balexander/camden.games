# Publishes the app/ folder to GitHub Pages so Fact Dash can be added to an iPhone home screen.
# Runs only when started by hand from the Actions tab. First set Settings > Pages > Source to "GitHub Actions".
# A Pages site is public even when the repository is private. It contains only the game, never anyone's progress.
name: Deploy Fact Dash
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
