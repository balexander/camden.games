<!doctype html>
<html lang="en">
<head>

<title>Fact Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-sized column on a sheet of graph paper; the flash card is the only raised object. */
:root{
  --paper:#f3f6fb; --grid:#dbe4f2; --card:#ffffff; --ink:#1b2540; --soft:#5b6785; --line:#c9d3e6;
  --blue:#2457d6; --blue-ink:#ffffff; --blue-wash:#e3ebff; --amber:#e08a00; --good:#14804a; --good-wash:#dcf5e7;
  --miss:#c2410c; --miss-wash:#ffe8dc; --star:#b97700;
  --h1:#cfdcff; --h2:#8eaafa; --h3:#4b77e6; --h4:#1b3f9e; --h4-ink:#ffffff;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111728; --grid:#1c2540; --card:#1c2440; --ink:#eef2ff; --soft:#a3aecb; --line:#34406a;
  --blue:#7ea2ff; --blue-ink:#0c1530; --blue-wash:#243260; --amber:#ffb84d; --good:#5fd699; --good-wash:#143a2a;
  --miss:#ff9a6b; --miss-wash:#47231a; --star:#ffcf5c;
  --h1:#26345f; --h2:#3c58a8; --h3:#6f93f5; --h4:#b9cbff; --h4-ink:#0c1530; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111728; --grid:#1c2540; --card:#1c2440; --ink:#eef2ff; --soft:#a3aecb; --line:#34406a;
  --blue:#7ea2ff; --blue-ink:#0c1530; --blue-wash:#243260; --amber:#ffb84d; --good:#5fd699; --good-wash:#143a2a;
  --miss:#ff9a6b; --miss-wash:#47231a; --star:#ffcf5c;
  --h1:#26345f; --h2:#3c58a8; --h3:#6f93f5; --h4:#b9cbff; --h4-ink:#0c1530; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.45 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:16px}
#app.play{height:100%;gap:10px;padding-block:10px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:800} h2{font-size:1.5rem;font-weight:800} h3{font-size:1.1rem;font-weight:600}
p{margin:0} .soft{color:var(--soft)} .small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{font:800 1.1rem var(--display);background:var(--blue);color:var(--blue-ink);border-radius:14px;padding:12px 20px;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.warn{background:var(--miss);box-shadow:none;color:var(--card)}
.btn.mini{font-size:.9rem;padding:6px 12px;border-radius:10px;min-height:44px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column;gap:10px}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.stat{font:800 1rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{color:var(--star)}
/* who */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.who button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px}
.who .new{border-style:dashed;color:var(--blue)} .who .new .av{font-family:var(--display);font-weight:800}
.av{font-size:2.6rem;line-height:1.1}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{font-size:1.7rem;width:48px;height:48px;border-radius:12px;border:2px solid transparent}
.avs button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash)}
input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
/* home */
.goal i{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-right:4px;vertical-align:-2px}
.goal i.on{background:var(--good);border-color:var(--good)}
.subject{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.subject button{font:800 1.15rem var(--display);padding:8px;min-height:44px;border-radius:11px;color:var(--soft)}
.subject button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.subject small{display:block;font:700 .75rem/1.2 var(--body)}
.subject.three{grid-template-columns:repeat(3,1fr)} .subject.three button{font-size:1rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;min-width:0}
.mode:active{transform:translateY(2px)}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}
.mode .sym{font:800 2.4rem/1 var(--display);color:var(--blue)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--paper);gap:2px}
.bar b{background:var(--h4)} .bar u{background:var(--h2)}
/* play */
.top{display:flex;align-items:center;gap:10px}
.x{width:44px;height:44px;flex:none;border-radius:50%;font-weight:800;color:var(--soft);background:var(--card);border:2px solid var(--line)}
.clock{flex:1;height:14px;border-radius:7px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.clock div{height:100%;background:var(--blue);width:100%;border-radius:5px}
.clock.low div{background:var(--miss)}
.card{flex:1;min-height:0;container-type:inline-size;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;overflow:hidden}
.card.good{border-color:var(--good);background:var(--good-wash)} .card.fix{border-color:var(--miss);background:var(--miss-wash)}
.q{font:800 clamp(2.4rem,15cqi,4rem)/1 var(--display);display:flex;gap:.25em;align-items:center;font-variant-numeric:tabular-nums}
.q.long{font-size:clamp(2rem,12.5cqi,4rem)} .q .op{color:var(--blue)}
.q .ans{min-width:1.5em;padding:0 .15em;border-bottom:5px solid var(--ink);min-height:1em;display:inline-block}
.card.good .ans{color:var(--good);border-color:var(--good)}
.word{font:800 clamp(2rem,10.5vw,3.2rem)/1.05 var(--display);display:flex;gap:.3em;align-items:center;justify-content:center;flex-wrap:wrap;overflow-wrap:anywhere;max-width:100%}
.say{font-size:1.3rem;width:44px;height:44px;border-radius:50%;background:var(--blue-wash)}
.pos{font:700 .8rem var(--body);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.def{font:800 1.35rem/1.2 var(--display);max-width:22em} .card.good .def{color:var(--good)}
.ex{font-style:italic;color:var(--soft);max-width:26em} .ex b{font-style:normal;color:var(--ink)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tag{font:800 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hint{font-size:1.05rem;font-weight:700;max-width:26em}
.fixline{font:800 1.05rem var(--body);color:var(--miss)}
.vis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.tf{display:grid;grid-template-columns:repeat(5,16px);gap:3px;padding:4px;border:2px solid var(--line);border-radius:6px}
.arr{display:grid;gap:3px}
.d{width:16px;height:16px;border-radius:50%;background:transparent;border:2px solid transparent}
.arr .d{width:10px;height:10px}
.d.a{background:var(--blue)} .d.b{background:var(--amber)} .d.e{border-color:var(--line);border-style:dotted}
.d.gone{border-color:var(--miss);background:linear-gradient(45deg,transparent 42%,var(--miss) 42% 58%,transparent 58%)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:800 1.7rem var(--display);height:clamp(46px,8.5vh,64px);border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:none;background:var(--blue-wash)}
.pad .alt{font-size:1rem;color:var(--soft)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.marks button{font:800 1.9rem var(--display);height:clamp(84px,17vh,130px);border-radius:18px;color:var(--card)}
.marks button:active{transform:translateY(3px);filter:brightness(.92)}
.marks .yes{background:var(--good)} .marks .no{background:var(--miss)} .marks .next{grid-column:1/-1;background:var(--blue);color:var(--blue-ink)}
.peek{text-align:center;font-weight:700;color:var(--soft)} .peek b{color:var(--ink);font:800 1.2rem var(--display);font-variant-numeric:tabular-nums;margin-left:4px}
.choices{display:grid;gap:8px}
.choices button{font-weight:700;font-size:1.05rem;text-align:left;padding:12px 14px;min-height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.choices button:active{transform:translateY(3px);box-shadow:none;background:var(--blue-wash)}
.choices button.right{border-color:var(--good);background:var(--good-wash)}
.count{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);font:800 7rem var(--display);color:var(--blue);z-index:5}
/* done + stats */
.big{font:800 5rem/1 var(--display);color:var(--blue);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.tiles div{display:flex;flex-direction:column} .tiles b{font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-weight:800;padding:6px 12px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.gridwrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;font:700 .7rem var(--body);font-variant-numeric:tabular-nums;margin:0 auto}
.heat th{color:var(--soft);font-weight:700;min-width:16px}
.heat td{padding:0}
.heat td button{display:block;width:100%;min-width:16px;height:22px;border-radius:4px;background:var(--paper);border:1px solid var(--line);font:inherit;color:var(--soft)}
.heat.wide td button{min-width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:700 .9rem var(--body);padding:5px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--soft)}
.map .b1{background:var(--h1);border-color:var(--h1);color:var(--ink)} .map .b2{background:var(--h2);border-color:var(--h2);color:var(--ink)}
.map .b3{background:var(--h3);border-color:var(--h3);color:var(--h4-ink)} .map .b4{background:var(--h4);border-color:var(--h4);color:var(--h4-ink)}
.map button[aria-pressed="true"]{outline:3px solid var(--amber);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.mylist{display:flex;flex-direction:column;gap:8px}
.mylist div{display:flex;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
svg text{font:700 11px var(--body);fill:var(--soft)}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:9;animation:fall 1.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.shake{animation:none}}
@media (max-height:640px){.tf{grid-template-columns:repeat(5,11px)}.d{width:11px;height:11px}.arr .d{width:8px;height:8px}.hint{font-size:.95rem}.def{font-size:1.15rem}}
/* phone turned sideways: the card takes the left side and the answer buttons the right */
@media (orientation:landscape) and (max-height:520px){
  #app.play{max-width:900px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:16px;row-gap:10px}
  #app.play>.top{grid-column:1/-1}
  #app.play>.card{grid-column:1;grid-row:2/4}
  #app.play>.peek{grid-column:2;grid-row:2;align-self:end}
  #app.play>.marks,#app.play>.pad,#app.play>.choices{grid-column:2;grid-row:3}
  #app.play>.marks{height:100%;grid-row:2/4;align-content:end}
  #app.play>.peek~.marks{grid-row:3}
  .pad button{height:clamp(44px,13vh,60px)}
  .marks button{height:clamp(84px,30vh,140px)}
}
</style>
<!--/head-->
</head>
<body>
<!--body-->
<main id="app"></main>
<script src="../shared/srs.js"></script>
<script src="../shared/words.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/profiles.js"></script>
<script>
(()=>{
const SPOKEN=1500,GOAL=3,CHILL=15,AVS=['🦊','🐼','🦖','🐙','🦁','🐸','🦄','🐧','🚀','⚽','🐯','🦉'];
const M=Core.MODES,TILES={math:['add','sub','mul','div','mix'],words:['v1','v2','v3','mine','vmix']},POS={adj:'describing word',verb:'action word',noun:'naming word'};
const app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
// The players and their saved progress belong to the whole site (see ../shared/profiles.js). Opened from the site's home page, where someone was just picked, the game skips its own picker.
const db=Profiles.db,{me,save,saveMeta,store,uid}=Profiles,getAcct=Profiles.account,online=Profiles.online;
let view=Profiles.picked()?'home':'who',ui={av:AVS[0],tab:'add',confirm:null,cell:null,adding:false,msg:'',pending:null},G=null,timer=null,actx=null,wake=null;
const opts=p=>({stretch:p.set.stretch,custom:db.words,range:p.set.range});
// Adding, subtracting and the math mix keep a separate best score for each number range.
const rangeOf=(p,m)=>m==='add'||m==='sub'||m==='mix'?p.set.range:'all',bestKey=(p,m)=>m+':'+secsOf(p)+(rangeOf(p,m)==='all'?'':':'+rangeOf(p,m));
// A speed round runs against the clock; practice is a fixed number of cards with no clock (stored as 0 seconds).
const secsOf=p=>p.set.round==='practice'?0:p.set.secs;
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const canSpeak='speechSynthesis' in window;

function beep(notes){const p=me();if(!p?.set.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;for(const [f,d] of notes){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.8;}}catch{}}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}catch{}}

/* ---------- keeping the data ----------
   Profiles (../shared/profiles.js) holds the players, saves every change in this browser, and keeps a copy online when signed in.
   This page tells it which player is mid-round, and redraws when data arrives. */
Profiles.busyWith(()=>view==='play'||view==='done'?db.cur:null);
Profiles.on(redraw=>{const n=Profiles.takeNotice();if(n)ui.syncMsg=n;if(!me()&&view!=='who'){view='who';G=null;}note(redraw);});
// Signs in or creates the account. The message changes in place so the typed password is kept.
async function signIn(path){
  const tell=t=>{ui.syncMsg=t;const el=document.getElementById('syncMsg');if(el)el.textContent=t;},raw=document.getElementById('acctName')?.value||'',name=Core.cleanLogin(raw),pw=document.getElementById('acctPw')?.value||'';ui.acctTry=raw;
  if(!name)return tell('The name needs 3 or more letters or numbers and no spaces. An email address works too.');
  if(pw.length<8)return tell('The password needs 8 or more characters.');
  tell(path==='signup'?'Creating the account…':'Signing in…');ui.syncMsg='';
  const r=await Profiles.signIn(path,name,pw);
  if(!r.ok)return tell({401:'That name and password do not match.',409:'That name is taken. Sign in, or pick another name.',429:'Too many wrong tries. Wait 15 minutes, then try again.',403:'New accounts are closed on this site.'}[r.status]||'Could not sign in. Check the connection and try again.');
  ui.acctTry='';ui.syncMsg=Profiles.status==='site'?(path==='signup'?'Account made. Players are saved online from now on.':'Signed in. Players are saved online from now on.'):'';render();
}
// Redraw after data arrives, keeping whatever is being typed. Mid-round, only the status line changes.
function note(redraw){
  if(redraw&&view!=='play'&&view!=='done'){const keep=[...app.querySelectorAll('input[type=text],input[type=password],textarea')].map(e=>[e.id,e.value]),focus=document.activeElement?.id;
    render();for(const [id,v] of keep){const e=document.getElementById(id);if(e)e.value=v;}if(focus)document.getElementById(focus)?.focus();return;}
  const el=document.getElementById('syncNote');if(el)el.textContent=statusText(true);
}
function statusText(short){
  if(Profiles.status==='site')return short?'Saved online.':'Saved online after every round. Sign in with the same name and password on any device to pick up where you left off.';
  if(Profiles.status==='account')return short?'Saved to your Claude account.':'Saved to your Claude account after every round. It stays between sessions and follows you to other devices.';
  if(Profiles.status==='checking')return 'Looking for saved players…';
  if(Profiles.status==='error')return !window.claude?.use?(short?'Could not reach the site. Saved on this device for now.':'Could not reach the site just now. Changes are kept on this device and sent the next time the page opens with a connection.')
    :short?'Could not reach your Claude account. Saved on this device for now.':'Could not reach your Claude account just now. Changes are kept on this device and sent when the page next opens.';
  return window.claude?.use?(short?'Saved in this browser only.':'Saved in this browser only. Open the page signed in to Claude to keep it between sessions, or save a CSV file.')
    :(short?'Saved on this device.':`Saved on this device after every answer. ${online?'Sign in under Online account to keep it online, or save':'Save'} a CSV file for your own copy.`);
}
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function describe(d){const who=d.players.map(p=>`${p.name} (${plural(p.rounds.length,'round')})`),parts=[...(who.length?[who.join(', ')]:[]),...(d.words.length?[plural(d.words.length,'word')+' of your own']:[])];return `This file has ${parts.join(' and ')}.`;}
const say=t=>{ui.msg=t;const el=document.getElementById('csvMsg');if(el)el.textContent=t;};
async function saveCSV(){
  const text=Core.toCSV(db),name=`fact-dash-${Core.dayKey(Date.now())}.csv`;
  if(!db.players.length&&!db.words.length)return say('There is nothing to save yet.');
  if(window.claude?.use){   // inside Claude a page cannot download by itself; the viewer confirms each file
    const dl=await claude.use('downloads').catch(()=>null);if(!dl)return say('Saving files is not available in this view.');
    try{await dl.save({filename:name,data:text});return say(`Saved ${name}.`);}catch(e){return say(e?.code==='declined'?'Nothing was saved.':e?.code==='rate_limited'?'A save is already waiting. Answer it, then try again.':'The file could not be saved here.');}
  }
  try{const file=new File([text],name,{type:'text/csv'});
    if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});return say(`Saved ${name}.`);}
    const a=document.createElement('a'),url=URL.createObjectURL(file);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);say(`Saved ${name} to your downloads.`);
  }catch(e){say(e?.name==='AbortError'?'Nothing was saved.':'The file could not be saved here.');}
}

/* ---------- pictures: ten-frames and arrays ---------- */
function frames(n,cls){let h='';for(let f=0;f<Math.ceil(n/10);f++){h+='<div class="tf">';for(let i=f*10;i<f*10+10;i++)h+=`<i class="d ${i<n?cls(i):'e'}"></i>`;h+='</div>';}return h;}
function array(rows,cols){return `<div class="arr" style="grid-template-columns:repeat(${Math.min(cols,10)},auto)">${'<i class="d a"></i>'.repeat(rows*cols)}</div>`;}
function picture(f,x,y){
  if(f.op==='add')return frames(x+y,i=>i<x?'a':'b');
  if(f.op==='sub')return frames(f.a,i=>i<f.a-f.b?'a':'gone');
  if(f.op==='mul')return array(x,y);
  return array(f.ans,f.b);
}
// The example sentence with the word in bold, whatever its ending (chuckle, chuckled).
function sentence(f){const stem=f.w.replace(/[ey]$/,'').replace(/[^a-z]/gi,''),i=stem?f.ex.search(new RegExp('\\b'+stem,'i')):-1;if(i<0)return esc(f.ex);const end=i+f.ex.slice(i).search(/[^a-z]|$/i);return esc(f.ex.slice(0,i))+'<b>'+esc(f.ex.slice(i,end))+'</b>'+esc(f.ex.slice(end));}
const label=f=>f.kind==='vocab'?esc(f.w):`${f.a} ${Core.OPS[f.op].sym} ${f.b} = ${f.ans}`;

function spark(rs){

    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/><line x1="${L}" x2="${W-R}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>

    <polyline fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" points="${rs.map((r,i)=>`${x(i)},${y(r.score)}`).join(' ')}"/>
    ${rs.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.score)}" r="${i===rs.length-1?5:3.5}" fill="var(--blue)" stroke="var(--card)" stroke-width="2"><title>${new Date(r.t).toLocaleDateString()}: ${r.score} right</title></circle>`).join('')}

}

    <div class="sheet col"><h3>My words</h3><p class="small soft">${db.words.length?`${db.words.length} of your own words, shared by every player.`:'Add this week\'s school words and they join the Words decks.'}</p><div><button class="btn ghost" data-act="go" data-v="words">${db.words.length?'Edit my words':'Add words'}</button></div></div>
    <div class="sheet col"><h3>On the iPhone</h3>${phone}</div>
    <div class="sheet col"><h3>How it works</h3><p class="small">Each card has a gap: how long it waits before it is asked again. A quick right answer stretches the gap, from 2 days to about 5, 12 and 31, up to 60. A right answer that was slow leaves the gap alone and brings the card back in half the time, because working it out is not yet knowing it by heart. A miss cuts the gap to a quarter and the card returns within the same dash. New cards arrive in random order (or easiest first, if you choose that above), and only while fewer than five are still shaky. The clock stops while a missed card is being corrected. When you mark spoken answers, a quick answer gets an extra second and a half to allow for saying it aloud.</p><p class="small">Math cards carry a number strategy and a dot picture. Word cards carry a sound-alike picture or the word's real parts, plus a sentence.</p><p class="small soft">A speed round counts how many he gets right before the clock runs out. Practice gives the same cards with no clock. Each keeps its own best score. Three rounds a day is the target. Short and daily beats long and rare.</p></div>
    ${online?accountSheet():''}
    <div class="sheet col"><h3>Saved data</h3><p class="small">${statusText()}</p><p class="small soft">A CSV file holds every player, every round played and every card's progress. Save one to keep your own copy or open it in a spreadsheet. Load one to bring the data back on any device.</p>
      <div class="row"><button class="btn ghost" data-act="csvSave">Save CSV file</button><button class="btn ghost" data-act="csvPick">Load CSV file</button><input type="file" id="csvFile" accept=".csv,text/csv" aria-label="CSV file to load" hidden></div>
      ${ui.pending?`<div class="row"><span class="grow"><b>Load this file?</b> ${esc(describe(ui.pending))} Players here with the same identity are replaced by the file's copy.</span><button class="btn" data-act="csvLoad">Load</button><button class="btn ghost" data-act="csvCancel">Cancel</button></div>`:''}
      <p class="small" id="csvMsg" aria-live="polite">${esc(ui.msg)}</p></div>
    <div class="sheet col"><h3>Players</h3>${db.players.map(q=>`<div class="row"><span class="grow">${esc(q.av||AVS[0])} <b>${esc(q.name)}</b>${q.id===p.id?' <span class="small soft">(playing now)</span>':''}<br><span class="small soft">★ ${q.stars} · ${plural(q.rounds.length,'round')}</span></span><button class="btn ghost" data-act="confirm" data-v="rm:${esc(q.id)}">Remove</button></div>
      ${ui.confirm==='rm:'+q.id?`<div class="row"><span class="grow"><b>Remove ${esc(q.name)} (★ ${q.stars})?</b> This cannot be undone.</span><button class="btn warn" data-act="remove" data-v="${esc(q.id)}">Remove</button><button class="btn ghost" data-act="confirm" data-v="">Keep</button></div>`:''}`).join('')}</div>
    <div class="sheet col"><h3>Start over</h3><div class="row"><button class="btn ghost" data-act="confirm" data-v="reset">Erase ${esc(p.name)}'s progress</button></div>
      ${ask('reset','Erase all progress?','Erase')}</div>`;
}
// One form serves both buttons: Sign in submits it, Create account makes a new account from the same two boxes.
const acctForm=()=>`<form class="col" id="acctForm"><label class="col" for="acctName"><span class="small soft">Name or email</span><input type="text" id="acctName" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" value="${esc(ui.acctTry||'')}"></label>
    <label class="col" for="acctPw"><span class="small soft">Password, 8 or more characters</span><input type="password" id="acctPw" name="password" autocomplete="current-password" maxlength="200"></label>
    <div class="row"><button class="btn" type="submit">Sign in</button><button class="btn ghost" type="button" data-act="signUp">Create account</button></div></form>`;
function accountSheet(){
  const acct=getAcct();
  if(acct)return `<div class="sheet col"><h3>Online account</h3><p class="small">${statusText()}</p>
    <p class="small soft">Signed in as <b>${esc(acct)}</b>.</p>
    <div class="row"><button class="btn ghost" data-act="syncRetry">Sync now</button><button class="btn ghost" data-act="signOut">Sign out</button></div>
    <p class="small" id="syncMsg" aria-live="polite">${esc(ui.syncMsg||'')}</p></div>`;
  return `<div class="sheet col"><h3>Online account</h3><p class="small soft">Sign in to keep players and progress online. Use the same name and password on every phone and computer.</p>
    ${acctForm()}
    <p class="small" id="syncMsg" aria-live="polite">${esc(ui.syncMsg||'')}</p></div>`;
}
function wordsView(){
  return `<header class="row"><button class="btn ghost" data-act="go" data-v="settings">← Back</button><h2 class="grow">My words</h2></header>
    <form class="sheet col" id="wordForm"><h3>Add a word</h3>
      <label class="col" for="cw"><span class="small soft">Word</span><input type="text" id="cw" maxlength="30" autocomplete="off" autocapitalize="none" placeholder="migrate"></label>
      <label class="col" for="cdef"><span class="small soft">Meaning, in words he would use</span><input type="text" id="cdef" maxlength="80" autocomplete="off" placeholder="to move to a new place"></label>
      <label class="col" for="chook"><span class="small soft">Memory trick (optional)</span><input type="text" id="chook" maxlength="140" autocomplete="off" placeholder="Sounds like my grate. My grate rolls away to a new house."></label>
      <p class="small" id="wordMsg" aria-live="polite"></p><div><button class="btn" type="submit">Add word</button></div></form>
    <div class="sheet col"><h3>${db.words.length?`${db.words.length} words`:'No words yet'}</h3>
      ${db.words.length?`<div class="mylist">${db.words.map(w=>`<div><span class="grow"><b>${esc(w.w)}</b>: ${esc(w.def)}${w.hook?`<br><span class="small soft">${esc(w.hook)}</span>`:''}</span><button class="btn ghost mini" data-act="unword" data-v="${w.id}" aria-label="Remove ${esc(w.w)}">Remove</button></div>`).join('')}</div>`
      :'<p class="small soft">Words you add show up as the My words deck under Words, and in All my words once he has played them.</p>'}</div>`;
}

/* ---------- the dash ---------- */
function start(mode){
  const p=me(),secs=secsOf(p);G={mode,secs,order:p.set.order,bk:bestKey(p,mode),range:rangeOf(p,mode),left:secs*1000,right:0,wrong:0,streak:0,bestStreak:0,stars:0,n:0,up:0,recent:[],newHard:0,log:[],count:3,deck:Core.deck(mode,opts(p),p.cards)};
  if(!G.deck.length){G=null;view='words';return render();}
  view='play';render();beep([[440,.12]]);
  try{navigator.wakeLock?.request('screen').then(w=>wake=w,()=>{});}catch{}
  const tick=()=>{if(view!=='play'||!G)return;G.count--;if(G.count){beep([[440,.12]]);render();setTimeout(tick,700);}else{beep([[880,.2]]);next();runClock();}};
  setTimeout(tick,700);
}
function next(){
  const p=me();if(!G.secs&&G.n>=CHILL)return finish();
  G.recent=G.recent.slice(-Math.min(3,G.deck.length-1));
  const pick=SRS.pick(p.cards,G.deck,G,Date.now()),f=pick.fact,flip=(f.op==='add'||f.op==='mul')&&Math.random()<.5;
  G.recent=[...G.recent,f.key].slice(-3);G.skipped=false;
  G.cur={fact:f,due:pick.due,isNew:pick.isNew,x:flip?f.b:f.a,y:flip?f.a:f.b,typed:'',phase:'ask',t0:performance.now(),mn:Core.mnemonic(f),wasLevel:SRS.view(p.cards[f.key]).level,hintOpen:false,
    choices:f.kind==='vocab'&&p.set.answer!=='coach'?Core.choices(f,[...G.deck,...Core.items('v1'),...Core.items('v2')]):null};
  render();
}
function runClock(){
  clearInterval(timer);let prev=performance.now();
  timer=setInterval(()=>{const now=performance.now(),dt=now-prev;prev=now;if(view!=='play'||!G){clearInterval(timer);return;}
    if(!G.secs||G.cur?.phase!=='ask'||document.hidden)return;
    G.left-=dt;const el=document.getElementById('clockFill');if(el){el.style.width=Math.max(0,G.left/(G.secs*1000)*100)+'%';el.parentNode.classList.toggle('low',G.left<10000);}
    if(G.left<=0)finish();},100);
}
function answer(ok){
  const p=me(),c=G.cur,f=c.fact,ms=performance.now()-c.t0,before=SRS.view(p.cards[f.key]).strength,slack=p.set.answer==='coach'?SPOKEN:0;
  p.cards[f.key]=SRS.review(p.cards[f.key],{ok,ms,fastMs:Core.fastMs(f)+slack,due:c.due},Date.now());
  if(c.isNew&&(!ok||ms>Core.fastMs(f)+slack))G.newHard++;
  if(SRS.view(p.cards[f.key]).strength>before&&!c.isNew||c.isNew&&ok)G.up++;
  G.log.push({fact:f,ok,ms});G.n++;
  if(ok){G.right++;G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);G.stars+=1+(G.streak%5===0?1:0);c.phase='good';beep([[660,.08],[880,.12]]);render();setTimeout(()=>{if(view==='play'&&G&&G.cur===c)next();},p.set.hints==='off'?350:f.kind==='vocab'?900:650);}
  else{G.wrong++;G.streak=0;c.phase='fix';c.typed='';beep([[220,.2]]);render();}
  p.updated=Date.now();store();   // the account store gets the round when it ends, not every answer
}
function key(v){
  if(view!=='play'||!G||G.count||me().set.answer==='coach'||G.cur.fact.kind==='vocab')return;const c=G.cur,want=String(c.fact.ans);c.shake=false;
  if(c.phase==='good')return;
  if(v==='back'){c.typed=c.typed.slice(0,-1);return render();}
  if(v==='skip'){if(c.phase==='ask'){G.skipped=true;answer(false);}return;}
  if(c.typed.length>=want.length)return;
  c.typed+=v;
  if(c.phase==='fix'){if(c.typed===want)return next();if(c.typed.length>=want.length){c.typed='';c.shake=true;}return render();}
  if(c.typed.length>=want.length)return answer(c.typed===want);
  render();
}
// A tap only counts once the card has been up for a moment, so a double tap cannot answer the next card too.
const ready=()=>view==='play'&&G&&!G.count&&G.cur.phase==='ask'&&performance.now()-G.cur.t0>350;
function finish(){
  clearInterval(timer);try{wake?.release();}catch{}wake=null;
  const p=me(),now=Date.now(),bk=G.bk,prev=p.best[bk]??null,dk=Core.dayKey(now);
  if(!G.n){view='home';G=null;return render();}
  const record=prev==null||G.right>prev;if(record)p.best[bk]=G.right;
  p.days[dk]=(p.days[dk]||0)+1;const goalHit=p.days[dk]===GOAL;
  const stars=G.stars+(record&&prev!=null?5:0)+(goalHit?3:0);p.stars+=stars;
  p.rounds.push({t:now,mode:G.mode,secs:G.secs,score:G.right,right:G.right,wrong:G.wrong,range:G.range});if(p.rounds.length>400)p.rounds=p.rounds.slice(-400);
  G.result={score:G.right,prev,record,stars,goalHit,up:G.up};ui.msg='';save(p);view='done';render();
  if(record&&prev!=null||goalHit){beep([[523,.12],[659,.12],[784,.12],[1047,.25]]);confetti();}else beep([[523,.12],[659,.2]]);
}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cols=['var(--blue)','var(--amber)','var(--good)','var(--star)'];for(let i=0;i<36;i++){const d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%4];d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}}

/* ---------- events ---------- */
const acts={
  av:v=>{ui.av=v;const n=document.getElementById('pname')?.value||'';render();const el=document.getElementById('pname');if(el)el.value=n;},
  add:()=>{ui.adding=true;render();document.getElementById('pname')?.focus();},cancelAdd:()=>{ui.adding=false;render();},
  pick:v=>{Profiles.choose(v);view='home';render();},who:()=>{view='who';ui.adding=false;render();},
  go:v=>{view=v;ui.confirm=null;ui.cell=null;ui.msg='';ui.pending=null;render();scrollTo(0,0);},start:v=>start(v),
  subject:v=>{const p=me();p.subject=v;save(p);render();},round:v=>{const p=me();p.set.round=v==='practice'?'practice':'speed';save(p);render();},range:v=>{const p=me();p.set.range=Core.SETTINGS.range.includes(v)?v:'all';save(p);render();},tipOff:()=>{db.tipOff=true;store();render();},
  quit:()=>{if(G.n)finish();else{clearInterval(timer);G=null;view='home';render();}},
  key:v=>key(v),
  mark:v=>{if(ready())answer(v==='yes');},
  choose:v=>{if(ready()&&G.cur.choices)answer(G.cur.choices[v]===G.cur.fact.def);},
  nextCard:()=>{if(view==='play'&&G&&!G.count&&G.cur.phase==='fix')next();},
  hint:()=>{G.cur.hintOpen=true;render();},say:()=>speak(G.cur.fact.w),
  tab:v=>{ui.tab=v;ui.cell=null;render();},cell:v=>{ui.cell=ui.cell===v?null:v;render();},
  set:(v,el)=>{const p=me(),k=el.dataset.k;p.set[k]=k==='secs'?Number(v):k==='stretch'||k==='sound'||k==='peek'?v==='true':v;save(p);render();},
  confirm:v=>{ui.confirm=v||null;render();},
  reset:()=>{const p=me();Object.assign(p,{cards:{},rounds:[],best:{},stars:0,days:{}});save(p);ui.confirm=null;view='home';render();},
  remove:id=>{Profiles.remove(id);ui.confirm=null;if(!me())view='who';render();},
  unword:v=>{db.words=db.words.filter(w=>w.id!==v);db.players.forEach(p=>{if(p.cards['my:'+v]){delete p.cards['my:'+v];save(p);}});saveMeta();render();},
  signUp:()=>signIn('signup'),
  syncRetry:async()=>{Profiles.status='checking';render();await Profiles.connect();if(getAcct())ui.syncMsg=Profiles.status==='site'?'Synced.':'Could not reach the site just now.';render();},
  signOut:async()=>{await Profiles.signOut();ui.syncMsg='Signed out. The players stay on this device.';render();},
  csvSave:()=>saveCSV(),csvPick:()=>document.getElementById('csvFile')?.click(),csvCancel:()=>{ui.pending=null;ui.msg='';render();},
  csvLoad:()=>{const d=ui.pending;if(!d)return;
    for(const p of d.players){delete db.gone[p.id];const i=db.players.findIndex(x=>x.id===p.id);if(i<0)db.players.push(p);else db.players[i]=p;save(p);}
    if(d.words.length){const ids=new Set(d.words.map(w=>w.id));db.words=Core.cleanWords([...d.words,...db.words.filter(w=>!ids.has(w.id))]);}
    saveMeta();ui.pending=null;ui.msg=`Loaded ${describe(d).replace(/^This file has /,'')}`;render();}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b.dataset.v,b);});
app.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='acctForm')return signIn('login');
  if(e.target.id==='wordForm'){const val=id=>document.getElementById(id).value.trim(),w=val('cw'),def=val('cdef'),msg=document.getElementById('wordMsg');
    if(!w||!def){msg.textContent='Type the word and what it means.';document.getElementById(w?'cdef':'cw').focus();return;}
    if(db.words.some(x=>x.w.toLowerCase()===w.toLowerCase())){msg.textContent=`${w} is already in your list.`;return;}
    if(db.words.length>=300){msg.textContent='That is the limit of 300 words. Remove one to add another.';return;}
    db.words.push({id:uid(),w,def,hook:val('chook')});saveMeta();render();document.getElementById('cw').focus();return;}
  const el=document.getElementById('pname'),name=el.value.trim();if(!name){el.focus();return;}const p=Profiles.add(name,ui.av);if(!p)return;Profiles.choose(p.id);ui.adding=false;view='home';render();});
app.addEventListener('change',e=>{if(e.target.id!=='csvFile'||!e.target.files[0])return;const r=new FileReader();
  r.onload=()=>{try{ui.pending=Core.fromCSV(r.result);ui.msg='';}catch{ui.pending=null;ui.msg='That file is not a Fact Dash CSV. Choose a file saved from Save CSV file.';}render();};
  r.onerror=()=>{ui.msg='That file could not be read. Try choosing it again.';render();};r.readAsText(e.target.files[0]);});
document.addEventListener('keydown',e=>{if(view!=='play'||!G||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k==='escape')return acts.quit();
  if(k===' '||k==='enter'){e.preventDefault();return acts.nextCard();}
  if(me().set.answer==='coach'){if(k==='y'||k==='arrowright')acts.mark('yes');else if(k==='n'||k==='arrowleft')acts.mark('no');return;}
  if(G.cur?.choices){if(/^[1-3]$/.test(k))acts.choose(k-1);return;}
  if(/^[0-9]$/.test(k))key(k);else if(k==='backspace'){e.preventDefault();key('back');}});
render();
Profiles.connect();
document.addEventListener('visibilitychange',()=>{if(document.hidden)Profiles.flush();else if(online&&getAcct()&&view!=='play'&&view!=='done')Profiles.connect();});
// Installed-app plumbing: offline cache and a request to keep saved progress from being cleared.
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&self===top)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage?.persist?.().catch(()=>{});}catch{}
})();
</script>
