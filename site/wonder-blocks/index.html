<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonder Blocks</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111728" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* One screen at a time: the start card, the well, or the end of a game. The well keeps its 10 by 16 shape and grows to
   fit the space between the top bar and the buttons. */
body{overscroll-behavior:none}
body.playing{overflow:hidden;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.center{align-items:center;text-align:center}
.big{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:700;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.go{font-size:1.35rem;padding:14px 30px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{display:flex;gap:10px;align-items:center;min-width:0}
.kind canvas,.kind .q{width:44px;height:44px;flex:none}
.kind .q{display:grid;place-items:center;border-radius:10px;border:2px dashed var(--line);color:var(--soft);font:800 1.4rem var(--display)}
.kind b{font:800 1.05rem/1.1 var(--display);display:block}
.kind small{color:var(--soft);font-size:.8rem;line-height:1.2;display:block}
@media (max-width:380px){.kinds{grid-template-columns:1fr}}

#app.play{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));gap:8px;padding-block:8px;touch-action:none;-webkit-user-select:none;user-select:none}
.hud{display:flex;gap:10px;align-items:center;flex:none;height:52px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none}
.ib svg,.pad svg{width:24px;height:24px;fill:currentColor}
.lv{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lv b{font:800 1.15rem/1 var(--display)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:5px;transition:width .3s}
.hud .stat{font-size:1.35rem;min-width:3ch;text-align:right}
.nx{display:flex;flex-direction:column;align-items:center;flex:none;line-height:1}
.nx small{font:800 .7rem var(--display);color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.nx canvas{width:56px;height:40px}
.stage{flex:1;min-height:0;display:grid;place-items:center}
.wrap{position:relative}
#board{display:block;box-sizing:content-box;border-radius:12px;border:2px solid var(--line);background:var(--card);touch-action:none}
#board:focus-visible{outline:none;border-color:var(--blue)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--paper) 72%,transparent)}
.ov .sheet{width:100%;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ov canvas{width:72px;height:72px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:none}
.pad button{height:62px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line);display:grid;place-items:center;margin-bottom:4px;touch-action:none}
.pad button.on,.pad button:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.pad button.drop{background:var(--blue);color:var(--blue-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.pad button.drop.on,.pad button.drop:active{box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.pad svg{width:30px;height:30px}
@media (max-height:560px){.pad button{height:48px}.hud{height:46px}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../shared/srs.js"></script>
<script src="../shared/words.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/profiles.js"></script>
<script src="game.js"></script>
<script>
// Wonder Blocks, the page. Blocks (game.js) knows the rules; this file draws the well, reads the buttons, keys and fingers,
// makes the sparks and sounds, and saves. Who is playing comes from Profiles, shared with every other game.
(()=>{
const GAME='wonder-blocks',B=Blocks,app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!Profiles.me()){location.replace('../');return;}   // nobody picked yet: the home page asks who is playing
const p=()=>Profiles.me(),mine=()=>{const me=p();me.games[GAME]=B.clean(me.games[GAME]);return me.games[GAME];};
// view is 'start', 'play' or 'done'. modal is a card over the well: null, 'pause', or the kind being introduced.
let view='start',G=null,modal=null,ending=0,beat=false,raf=0,last=0,actx=null;
Profiles.busyWith(()=>view==='start'?null:Profiles.db.cur);
Profiles.on(()=>{if(!p())location.replace('../');else if(view==='start')render();});

/* ---------- sound ---------- */
// iPhones and iPads only allow sound that starts from a touch, so the first touch wakes the sound up.
function wake(){if(!p()?.set.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch{}}
const audible=()=>p()?.set.sound&&actx&&actx.state==='running';
// notes: [frequency, seconds, frequency to slide to]. They play one after another.
function beep(notes,type='triangle',vol=.1){if(!audible())return;try{let t=actx.currentTime;for(const [f,d,to] of notes){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.8;}}catch{}}
function rumble(d=.4,vol=.25){if(!audible())return;try{const n=Math.floor(actx.sampleRate*d),buf=actx.createBuffer(1,n,actx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;src.buffer=buf;g.gain.value=vol;src.connect(f).connect(g).connect(actx.destination);src.start();}catch{}}
const buzz=ms=>{try{if(p()?.set.sound&&navigator.vibrate)navigator.vibrate(ms);}catch{}};

/* ---------- painting blocks ---------- */
// One colour for each shape and each special kind, picked to read on both the white and the dark navy well.
const COLORS={I:'#17a9c2',O:'#e6ac00',T:'#9b5de5',S:'#2fa866',Z:'#e5484d',J:'#2f6fed',L:'#f08a24',boom:'#2a2d3a',melt:'#7fcf2a',zap:'#4b33d6',ice:'#a9e1fb',anvil:'#737c90',ghost:'#d5cefa'};
const SPARK={boom:'#ff7a2c',melt:'#7fcf2a',zap:'#ffe14d',ice:'#d9f3ff',anvil:'#9aa3b5',ghost:'#e4e0ff'};
// Paints one block c pixels wide with its corner at x, y. t is the time in seconds, for the parts that flicker.
function block(g,x,y,c,code,t=0,alpha=1){
  const m=c*.05,w=c-2*m,r=w*.2,dot=(cx,cy,rad)=>{g.beginPath();g.arc(cx*w,cy*w,rad*w,0,7);g.fill();};
  g.save();g.translate(x+m,y+m);g.globalAlpha=alpha*(code==='ghost'?.85:1);
  if(code==='melt'){g.fillStyle='#5fae16';dot(.26,.97,.13);dot(.66,1,.17);}   // drips hang below the block
  g.fillStyle=COLORS[code]||'#888';g.beginPath();g.roundRect(0,0,w,w,r);g.fill();
  g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.roundRect(0,w*.62,w,w*.38,[0,0,r,r]);g.fill();
  g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.roundRect(w*.12,w*.1,w*.76,w*.2,w*.1);g.fill();
  if(code==='boom'){
    const f=.5+.5*Math.sin(t*9+x*.05);
    g.strokeStyle=`rgba(255,122,44,${.55+.45*f})`;g.lineWidth=Math.max(1.5,w*.09);g.beginPath();g.roundRect(0,0,w,w,r);g.stroke();
    g.fillStyle='#08090d';dot(.47,.6,.25);g.fillStyle='rgba(255,255,255,.35)';dot(.39,.52,.07);
    g.strokeStyle='#c9a36b';g.lineWidth=w*.07;g.lineCap='round';g.beginPath();g.moveTo(.6*w,.42*w);g.lineTo(.72*w,.28*w);g.stroke();
    g.fillStyle='#ffb020';dot(.75,.24,.09+.05*f);g.fillStyle='#fff3c4';dot(.75,.24,.04+.02*f);
  }else if(code==='zap'){
    g.fillStyle='#ffe14d';g.beginPath();for(const [i,[px,py]] of [[.6,.08],[.24,.56],[.46,.56],[.38,.92],[.78,.42],[.55,.42]].entries())g[i?'lineTo':'moveTo'](px*w,py*w);g.closePath();g.fill();
  }else if(code==='ice'){
    g.strokeStyle='#fff';g.lineWidth=w*.08;g.lineCap='round';g.beginPath();
    for(let i=0;i<3;i++){const a=i*Math.PI/3+Math.PI/6,dx=Math.cos(a)*w*.3,dy=Math.sin(a)*w*.3;g.moveTo(w/2-dx,w/2-dy);g.lineTo(w/2+dx,w/2+dy);}g.stroke();
    g.strokeStyle='#5fbdea';g.lineWidth=Math.max(1,w*.05);g.beginPath();g.roundRect(0,0,w,w,r);g.stroke();
  }else if(code==='anvil'){
    g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.roundRect(w*.2,w*.34,w*.6,w*.36,w*.08);g.fill();
    for(const [cx,cy] of [[.16,.16],[.84,.16],[.16,.84],[.84,.84]])dot(cx,cy,.06);
  }else if(code==='ghost'){
    g.fillStyle='#39335e';g.beginPath();g.ellipse(.34*w,.48*w,.08*w,.12*w,0,0,7);g.ellipse(.66*w,.48*w,.08*w,.12*w,0,0,7);g.fill();dot(.5,.74,.06);
    g.strokeStyle='#8478d6';g.lineWidth=Math.max(1,w*.06);g.beginPath();g.roundRect(0,0,w,w,r);g.stroke();
  }else if(code==='melt'){g.fillStyle='rgba(255,255,255,.55)';dot(.3,.42,.07);dot(.44,.5,.04);}
  g.restore();
}
// Fills a small canvas with one block, for the cards that explain a kind.
function icon(cv,code){const d=Math.min(3,devicePixelRatio||1),w=cv.clientWidth||44;cv.width=cv.height=w*d;const g=cv.getContext('2d');g.scale(d,d);block(g,w*.06,w*.02,w*.88,code,.2);}
const icons=()=>app.querySelectorAll('canvas[data-kind]').forEach(c=>icon(c,c.dataset.kind));

/* ---------- screens ---------- */
function render(){
  app.className=view;document.body.classList.toggle('playing',view==='play');
  app.innerHTML={start:startView,play:playView,done:doneView}[view]();icons();
  if(view==='play'){fit();hud(true);showModal();}
}
const SPEED=[['chill','Chill'],['normal','Normal'],['zippy','Zippy']];
function startView(){
  const me=p(),g=mine(),left=B.KINDS.length-g.kinds.length;
  return `<header class="row"><a class="btn ghost" href="../">← Games</a><h2 class="grow">Wonder Blocks</h2></header>
    <div class="sheet col center"><span class="av">${esc(me.av||'🧱')}</span><h2>${esc(me.name)}</h2>
      ${g.games?`<p class="soft">Best score</p><div class="big">${g.best}</div>`:'<p class="soft">Stack the blocks. Fill a row to clear it.</p>'}
      <button class="btn go" data-act="play">Play</button>
      <div class="seg" role="group" aria-label="Speed">${SPEED.map(([v,t])=>`<button data-act="speed" data-v="${v}" aria-pressed="${g.speed===v}">${t}</button>`).join('')}</div></div>
    <div class="sheet col"><h3>Wonder blocks</h3>
      <div class="kinds">${B.KINDS.map(k=>g.kinds.includes(k.id)?`<div class="kind"><canvas data-kind="${k.id}"></canvas><span><b>${k.name}</b><small>${k.say}</small></span></div>`
        :`<div class="kind"><span class="q">?</span><span><b class="soft">Hidden</b><small>Level up to find it.</small></span></div>`).join('')}</div>
      <p class="small soft">${left?`${left} more to find. A new one comes with each level.`:'You found every wonder block!'}</p></div>
    <div class="sheet col"><h3>How to play</h3>
      <p class="small soft">Use the buttons, or touch the well: slide to move, tap to turn, flick down to drop. On a keyboard use the arrows and the space bar.</p></div>`;
}
const SVG={pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',left:'<path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
  right:'<path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
  down:'<path d="M4.5 9 12 16.5 19.5 9" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>',
  turn:'<path d="M19 12a7 7 0 1 1-2.6-5.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M20.5 2.5v6h-6z"/>',
  drop:'<path d="M12 3v10M6.5 9 12 14.5 17.5 9" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18.5h16v3H4z"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${SVG[n]}</svg>`;
function playView(){
  return `<div class="hud"><button class="ib" data-act="pause" aria-label="Pause">${svg('pause')}</button>
      <div class="lv"><b id="lv"></b><div class="bar" role="img" id="barBox"><i id="bar"></i></div></div>
      <span class="stat" id="score" aria-label="Score">0</span>
      <div class="nx"><small>Next</small><canvas id="next" aria-hidden="true"></canvas></div></div>
    <div class="stage"><div class="wrap"><canvas id="board" tabindex="0" role="application" aria-label="The well. Arrow keys move, up turns, space drops."></canvas><div id="ov"></div></div></div>
    <div class="pad">${[['left','Move left'],['right','Move right'],['down','Fall faster'],['turn','Turn'],['drop','Drop']].map(([k,t])=>`<button data-key="${k}" aria-label="${t}"${k==='drop'?' class="drop"':''}>${svg(k)}</button>`).join('')}</div>
    <p id="say" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>`;
}
function doneView(){
  const g=mine(),names=G.found.map(id=>B.KINDS.find(k=>k.id===id).name);
  return `<header class="col center"><h2>${beat?'Best score yet!':'Good game!'}</h2><p class="soft">Level ${G.level} · ${G.lines} line${G.lines===1?'':'s'}</p></header>
    <div class="sheet col center"><span class="av">${esc(p().av||'🧱')}</span><div class="big">${G.score}</div>
      ${beat?'':`<p class="small soft">Best ${g.best}</p>`}
      ${names.length?`<div class="row" style="justify-content:center">${G.found.map(id=>`<canvas data-kind="${id}" style="width:44px;height:44px"></canvas>`).join('')}</div><p><b>New: ${names.join(', ')}!</b></p>`:''}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="play">Play again</button><button class="btn ghost" data-act="home">Stop for now</button></div>`;
}
// The card over the well: paused, or the first meeting with a new kind of block.
function showModal(){
  const ov=document.getElementById('ov');if(!ov)return;
  if(!modal){ov.className='';ov.innerHTML='';return;}
  const k=B.KINDS.find(x=>x.id===modal);
  ov.className='ov';
  ov.innerHTML=k?`<div class="sheet col center" role="dialog" aria-label="New block"><p class="small soft">New block!</p><canvas data-kind="${k.id}"></canvas><h2>${k.name}</h2><p>${k.say}</p><button class="btn" data-act="resume">Got it!</button></div>`
    :`<div class="sheet col center" role="dialog" aria-label="Paused"><h2>Paused</h2><button class="btn" data-act="resume">Keep playing</button><button class="btn ghost" data-act="quit">Stop</button></div>`;
  icons();ov.querySelector('.btn')?.focus();
}

/* ---------- the well ---------- */
let cv=null,cx=null,cell=24,dpr=1,theme={};
function fit(){
  cv=document.getElementById('board');const st=app.querySelector('.stage');if(!cv||!st)return;
  const r=st.getBoundingClientRect();cell=Math.max(8,Math.floor(Math.min((r.width-4)/B.COLS,(r.height-4)/B.ROWS)));dpr=Math.min(3,devicePixelRatio||1);
  cv.style.width=cell*B.COLS+'px';cv.style.height=cell*B.ROWS+'px';cv.width=cell*B.COLS*dpr;cv.height=cell*B.ROWS*dpr;cx=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  theme={card:v('--card'),line:v('--line'),ink:v('--ink'),soft:v('--soft'),grid:v('--grid'),dark:matchMedia('(prefers-color-scheme: dark)').matches};
  const nx=document.getElementById('next');if(nx){nx.width=56*dpr;nx.height=40*dpr;}shown.next=null;
}
// What is flying about: blocks sliding to a new row, sparks, flashes and words. All measured in blocks, so a turned phone
// does not scatter them.
let slides=new Map(),sparks=[],flashes=[],words=[],shake=0;
const ease=u=>1-(1-u)*(1-u);
function slide(moves,dur){if(calm)return;for(const m of moves)if(m.y1!==m.y0)slides.set(m.x+','+m.y1,{y0:m.y0,t:0,dur});}
function burst(cells,color,each=4,power=7){if(calm)each=1;for(const c of cells){const [x,y]=Array.isArray(c)?c:[c.x,c.y],col=color||COLORS[c.c]||'#fff';
  for(let i=0;i<each;i++){const a=Math.random()*6.283,v=power*(.3+Math.random()*.7);sparks.push({x:x+.5,y:y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,t:0,life:.45+Math.random()*.35,size:.14+Math.random()*.2,col});}}
  if(sparks.length>500)sparks.splice(0,sparks.length-500);}
const word=(text,x,y,col,size=1)=>{words.push({text,x:Math.max(2.2,Math.min(B.COLS-2.2,x)),y:Math.max(1.5,y),t:0,col,size});say(text);};
const say=t=>{const el=document.getElementById('say');if(el)el.textContent=t;};
const mid=cells=>[cells.reduce((a,c)=>a+c[0],0)/cells.length+.5,cells.reduce((a,c)=>a+c[1],0)/cells.length+.5];

function events(ev){
  for(const e of ev){
    const at=e.cells?mid(e.cells):null;
    if(e.type==='lock'){beep([[180,.05]],'square',.05);flashes.push({kind:'cells',cells:e.cells,t:0,life:.18});}
    else if(e.type==='boom'){burst(e.removed,null,e.removed.length>14?3:5,11);burst(e.cells,SPARK.boom,8,12);flashes.push({kind:'ring',x:at[0],y:at[1],t:0,life:.4});shake=calm?0:.5;rumble(.5,.3);beep([[120,.3,40]],'sawtooth',.12);buzz(60);word('BOOM!',at[0],at[1]-1,SPARK.boom,1.5);}
    else if(e.type==='zap'){const [x,y]=e.cells[0];burst(e.removed,SPARK.zap,3,6);flashes.push({kind:'beam',x,y,t:0,life:.35});shake=calm?0:.2;beep([[1400,.12,300],[900,.18,120]],'sawtooth',.07);buzz(30);word('ZAP!',at[0],at[1]-1,SPARK.zap,1.4);}
    else if(e.type==='melt'){slide(e.moves,.3);burst(e.moves.map(m=>[m.x,m.y1]),SPARK.melt,2,3);beep([[420,.22,140],[300,.2,110]],'sine',.12);if(e.moves.some(m=>m.y1>m.y0))word('Melt!',at[0],at[1]-1,SPARK.melt,1.1);}
    else if(e.type==='ghost'){slide(e.moves,.4);beep([[520,.2,780],[660,.3,440]],'sine',.09);if(e.moves.some(m=>m.y1>m.y0))word('Boo!',at[0],at[1]-1,theme.dark?SPARK.ghost:'#7a6fd0',1.2);}
    else if(e.type==='ice'){burst(e.cells,SPARK.ice,7,5);beep([[1320,.12],[1760,.12],[2093,.25]],'sine',.07);word('Freeze!',at[0],at[1]-1,'#3aa7dd',1.2);}
    else if(e.type==='anvil'){burst(e.removed,null,3,6);flashes.push({kind:'rows',rows:[B.ROWS-2,B.ROWS-1],t:0,life:.35});shake=calm?0:.7;rumble(.35,.35);beep([[90,.3,35]],'square',.12);buzz(80);word('SQUASH!',5,B.ROWS-3.5,theme.dark?'#c5ccdb':'#5a6375',1.4);}
    else if(e.type==='settle')slide(e.moves,.16);
    else if(e.type==='lines'){const n=e.rows.length;burst(e.removed,null,n>2?3:4,8);flashes.push({kind:'rows',rows:[...e.rows],t:0,life:.3});
      beep([[523,.08],[659,.08],[784,.08],[1047,.16],[1319,.2]].slice(0,n+1));if(n>=3)shake=calm?0:.3;
      word(n===4?'WOW! +'+e.points:'+'+e.points,5,e.rows[0]-.5,theme.dark?'#ffcf5c':'#b97700',n>=3?1.5:1.2);}
    else if(e.type==='level'){beep([[523,.09],[784,.09],[1047,.09],[1568,.25]]);word('Level '+e.level+'!',5,4,theme.dark?'#7ea2ff':'#2457d6',1.5);}
    else if(e.type==='spawn'){const g=mine();if(e.kind&&!g.told.includes(e.kind)){g.told.push(e.kind);if(!g.kinds.includes(e.kind))g.kinds=B.KINDS.map(k=>k.id).filter(id=>g.kinds.includes(id)||id===e.kind);Profiles.save(p());modal=e.kind;stopHolds();showModal();}}
    else if(e.type==='over'){ending=.001;stopHolds();beep([[392,.18],[330,.18],[262,.4]],'triangle',.1);
      beat=B.record(mine(),G);Profiles.save(p());say('Game over');}
  }
}
// Draws the top bar only when something in it changed.
const shown={};
function hud(force){
  if(force)for(const k of Object.keys(shown))delete shown[k];
  const set=(k,v,f)=>{if(shown[k]!==v){shown[k]=v;f(v);}},el=id=>document.getElementById(id);
  set('lv',G.level,v=>{el('lv').textContent='Level '+v;});
  set('goal',G.lines%B.GOAL,v=>{el('bar').style.width=v/B.GOAL*100+'%';el('barBox').setAttribute('aria-label',`${B.GOAL-v} more line${B.GOAL-v===1?'':'s'} to the next level`);});
  set('score',G.score,v=>{el('score').textContent=v;});
  set('next',G.next.shape+(G.next.kind||''),()=>{const nx=el('next'),g=nx.getContext('2d'),n=B.SHAPES[G.next.shape].n,c=12,cs=B.cells({shape:G.next.shape,rot:0,x:0,y:0});
    const xs=cs.map(q=>q[0]),ys=cs.map(q=>q[1]),w=Math.max(...xs)-Math.min(...xs)+1,h=Math.max(...ys)-Math.min(...ys)+1;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,56,40);for(const [x,y] of cs)block(g,(56-w*c)/2+(x-Math.min(...xs))*c,(40-h*c)/2+(y-Math.min(...ys))*c,c,G.next.kind||G.next.shape,.2);});
}
const TINT={boom:'255,110,40',zap:'255,214,40',anvil:'130,140,160'};
function draw(now,dt){
  const g=cx,c=cell,W=B.COLS*c,H=B.ROWS*c;if(!g)return;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  g.save();if(shake>0){const a=shake*c*.35;g.translate((Math.random()-.5)*a,(Math.random()-.5)*a);}
  g.strokeStyle=theme.grid;g.lineWidth=1;g.beginPath();for(let x=1;x<B.COLS;x++){g.moveTo(x*c+.5,0);g.lineTo(x*c+.5,H);}for(let y=1;y<B.ROWS;y++){g.moveTo(0,y*c+.5);g.lineTo(W,y*c+.5);}g.stroke();
  // the hint: where the piece will land, and what a special one will reach
  const pc=G.piece,pv=G.phase==='fall'&&pc?B.preview(G):null,code=pc&&(pc.kind||pc.shape);
  if(pv){
    if(TINT[pc.kind]){g.fillStyle=`rgba(${TINT[pc.kind]},${.13+.05*Math.sin(now*5)})`;for(const [x,y] of pv.zone)g.fillRect(x*c,y*c,c,c);}
    const spots=pv.land.length?pv.land:pv.cells;g.lineWidth=2;g.strokeStyle={boom:SPARK.boom,ghost:'#8478d6',ice:'#5fbdea'}[code]||COLORS[code];g.fillStyle=theme.dark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)';
    for(const [x,y] of spots){g.beginPath();g.roundRect(x*c+3,y*c+3,c-6,c-6,c*.16);g.fill();g.stroke();}
  }
  // the stack. After the game ends it turns grey from the bottom up.
  const greyFrom=ending?B.ROWS-ending/.9*B.ROWS:B.ROWS;
  for(let y=0;y<B.ROWS;y++)for(let x=0;x<B.COLS;x++){const v=G.board[y][x];if(!v||v===B.GONE)continue;
    const s=slides.get(x+','+y);let yy=y;if(s)yy=s.y0+(y-s.y0)*ease(Math.min(1,s.t/s.dur));
    if(y>=greyFrom){g.save();g.filter='grayscale(1)';block(g,x*c,yy*c,c,v,now,.7);g.restore();}else block(g,x*c,yy*c,c,v,now);}
  if(pv&&TINT[pc.kind]){g.strokeStyle=`rgba(${TINT[pc.kind]},.9)`;g.lineWidth=2;for(const [x,y] of pv.hits){g.beginPath();g.roundRect(x*c+2,y*c+2,c-4,c-4,c*.18);g.stroke();}}
  if(pc&&G.phase!=='over')for(const [x,y] of B.cells(pc))block(g,x*c,y*c,c,code,now);
  else if(pc)for(const [x,y] of B.cells(pc))block(g,x*c,y*c,c,code,now,.5);
  // flashes: white on the dark well, gold on the white one
  const glow=theme.dark?'255,255,255':'255,196,60';
  for(const f of flashes){const u=f.t/f.life,a=1-u;
    if(f.kind==='cells'){g.fillStyle=`rgba(${glow},${.6*a})`;for(const [x,y] of f.cells){g.beginPath();g.roundRect(x*c+c*.05,y*c+c*.05,c*.9,c*.9,c*.18);g.fill();}}
    else if(f.kind==='trail'){for(const [x,y0,y1] of f.cols){const tr=g.createLinearGradient(0,y0*c,0,y1*c);tr.addColorStop(0,'rgba(255,255,255,0)');tr.addColorStop(1,`rgba(${theme.dark?'255,255,255':'120,140,190'},${.35*a})`);g.fillStyle=tr;g.fillRect(x*c+c*.1,y0*c,c*.8,(y1-y0)*c);}}
    else if(f.kind==='rows'){g.fillStyle=`rgba(${glow},${.85*a})`;for(const y of f.rows)g.fillRect(0,y*c,W,c);}
    else if(f.kind==='beam'){g.fillStyle=`rgba(255,235,120,${.9*a})`;g.fillRect(0,f.y*c+c*.5*u,W,c*(1-u));g.fillRect(f.x*c+c*.5*u,0,c*(1-u),H);g.fillStyle=`rgba(255,255,255,${a})`;g.fillRect(0,f.y*c+c*.35,W,c*.3*a);g.fillRect(f.x*c+c*.35,0,c*.3*a,H);}
    else{g.fillStyle=`rgba(255,200,120,${.5*a})`;g.beginPath();g.arc(f.x*c,f.y*c,c*(1+3*ease(u)),0,7);g.fill();g.strokeStyle=`rgba(255,110,40,${a})`;g.lineWidth=c*.3*a+1;g.beginPath();g.arc(f.x*c,f.y*c,c*(.6+3.4*ease(u)),0,7);g.stroke();}}
  for(const s of sparks){const a=1-s.t/s.life;g.globalAlpha=a;g.fillStyle=s.col;const z=s.size*c*(.5+.5*a);g.fillRect(s.x*c-z/2,s.y*c-z/2,z,z);}
  g.globalAlpha=1;
  // frozen time: a frosty edge and how many slow pieces are left
  if(G.slow>0&&G.phase!=='over'){const fr=g.createLinearGradient(0,0,0,H);fr.addColorStop(0,'rgba(140,215,255,.5)');fr.addColorStop(.18,'rgba(140,215,255,0)');fr.addColorStop(.85,'rgba(140,215,255,0)');fr.addColorStop(1,'rgba(140,215,255,.35)');g.fillStyle=fr;g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(120,205,250,.9)';g.lineWidth=4;g.strokeRect(2,2,W-4,H-4);block(g,6,6,c*.7,'ice',now);
    g.font=`800 ${c*.6}px "Baloo 2",sans-serif`;g.textAlign='left';g.textBaseline='middle';g.fillStyle=theme.ink;g.fillText('× '+G.slow,6+c*.8,6+c*.38);}
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  for(const w of words){const u=w.t/1.1,a=u<.7?1:1-(u-.7)/.3,pop=calm?1:Math.min(1,.5+w.t*6);g.globalAlpha=Math.max(0,a);
    g.font=`800 ${c*.95*w.size*pop}px "Baloo 2","Trebuchet MS",sans-serif`;g.lineWidth=c*.2;g.strokeStyle=theme.card;g.strokeText(w.text,w.x*c,(w.y-(calm?0:u*1.2))*c);g.fillStyle=w.col;g.fillText(w.text,w.x*c,(w.y-(calm?0:u*1.2))*c);}
  g.globalAlpha=1;g.restore();
  if(ending){g.fillStyle=theme.dark?'rgba(17,23,40,.55)':'rgba(243,246,251,.6)';g.globalAlpha=Math.min(1,ending/.6);g.fillRect(0,0,W,H);g.globalAlpha=1;
    g.font=`800 ${c*1.5}px "Baloo 2","Trebuchet MS",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=c*.25;g.lineJoin='round';g.strokeStyle=theme.card;g.strokeText('Game over',W/2,H*.42);g.fillStyle=theme.ink;g.fillText('Game over',W/2,H*.42);}
  // age everything that is flying
  for(const [k,s] of slides){s.t+=dt;if(s.t>=s.dur)slides.delete(k);}
  for(const s of sparks){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=22*dt;}sparks=sparks.filter(s=>s.t<s.life);
  for(const f of flashes)f.t+=dt;flashes=flashes.filter(f=>f.t<f.life);
  for(const w of words)w.t+=dt;words=words.filter(w=>w.t<1.1);
  shake=Math.max(0,shake-dt*1.6);
}
function frame(t){
  raf=requestAnimationFrame(frame);const dt=Math.min(.1,Math.max(0,(t-last)/1000));last=t;
  if(view!=='play'||!G)return;
  if(ending){ending+=dt;if(ending>1.9){cancelAnimationFrame(raf);view='done';return render();}}
  else if(!modal)events(B.step(G,dt));
  hud();draw(t/1000,modal?0:dt);
}
function startGame(){
  const g=mine();G=B.start({speed:g.speed,kinds:g.kinds});modal=null;ending=0;beat=false;slides=new Map();sparks=[];flashes=[];words=[];shake=0;
  view='play';render();cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame);
  events([{type:'spawn',shape:G.piece.shape,kind:G.piece.kind}]);document.getElementById('board')?.focus({preventScroll:true});
}
const live=()=>view==='play'&&G&&!modal&&!ending;
function pause(){if(view!=='play'||modal||ending)return;modal='pause';stopHolds();showModal();}
function resume(){modal=null;showModal();last=performance.now();document.getElementById('board')?.focus({preventScroll:true});}

/* ---------- buttons, keys and fingers ---------- */
const tick=()=>beep([[660,.025]],'square',.03);
const keys={
  left:()=>{if(B.move(G,-1))tick();},right:()=>{if(B.move(G,1))tick();},
  turn:()=>{if(B.rotate(G,1))beep([[880,.04]],'square',.04);},back:()=>{if(B.rotate(G,-1))beep([[880,.04]],'square',.04);},
  drop:()=>{if(!G.piece)return;const from=B.cells(G.piece),fall=B.landing(G)-G.piece.y,ev=B.drop(G);
    if(ev.length){if(fall>1&&!calm)flashes.push({kind:'trail',cols:from.map(([x,y])=>[x,y,y+fall]),t:0,life:.2});beep([[300,.07,90]],'triangle',.08);events(ev);}},
};
// Holding left or right keeps moving after a short wait; holding down keeps the piece falling fast.
let holds=new Map();
function stopHolds(){for(const [,h] of holds){clearTimeout(h.t);clearInterval(h.i);h.el?.classList.remove('on');}holds.clear();if(G)B.soft(G,false);}
function press(id,k,el){
  if(!live())return;el?.classList.add('on');const h={el};holds.set(id,h);
  if(k==='down'){h.down=true;return B.soft(G,true);}
  keys[k]();
  if(k==='left'||k==='right')h.t=setTimeout(()=>{h.i=setInterval(()=>{if(live())keys[k]();},65);},190);
}
function release(id){const h=holds.get(id);if(!h)return;clearTimeout(h.t);clearInterval(h.i);h.el?.classList.remove('on');holds.delete(id);if(G&&![...holds.values()].some(x=>x.down))B.soft(G,false);}
const acts={
  play:startGame,home:()=>{view='start';render();},pause,resume,
  quit:()=>{cancelAnimationFrame(raf);modal=null;if(G&&G.score>0){B.record(mine(),G);Profiles.save(p());}view='start';render();},
  speed:v=>{mine().speed=v;Profiles.save(p());render();},
};
app.addEventListener('click',e=>{wake();const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b.dataset.v);});
// On the well: slide a finger to move the piece a column at a time, tap to turn, flick down to drop.
let touch=null;
app.addEventListener('pointerdown',e=>{wake();
  const b=e.target.closest('[data-key]');
  if(b){e.preventDefault();return press('p'+e.pointerId,b.dataset.key,b);}
  if(e.target.id==='board'&&live()){touch={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),moved:false,piece:G.pieces};try{e.target.setPointerCapture(e.pointerId);}catch{}}
});
app.addEventListener('pointermove',e=>{
  if(!touch||e.pointerId!==touch.id||!live()||G.pieces!==touch.piece)return;
  const step=Math.max(18,cell*.8);
  while(e.clientX-touch.x>=step){touch.x+=step;touch.moved=true;keys.right();}
  while(touch.x-e.clientX>=step){touch.x-=step;touch.moved=true;keys.left();}
});
const lift=e=>{release('p'+e.pointerId);
  if(!touch||e.pointerId!==touch.id)return;const t=touch;touch=null;
  if(e.type!=='pointerup'||!live()||G.pieces!==t.piece)return;
  const dx=e.clientX-t.x0,dy=e.clientY-t.y0,ms=performance.now()-t.t;
  if(dy>cell*2&&dy>Math.abs(dx)*1.5&&ms<400)keys.drop();
  else if(!t.moved&&Math.abs(dx)<12&&Math.abs(dy)<12&&ms<400)keys.turn();
};
addEventListener('pointerup',lift);addEventListener('pointercancel',lift);
app.addEventListener('contextmenu',e=>{if(view==='play')e.preventDefault();});
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'turn',x:'turn',X:'turn',z:'back',Z:'back',' ':'drop'};
addEventListener('keydown',e=>{wake();if(e.metaKey||e.ctrlKey||e.altKey||view!=='play')return;
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();return modal?(modal==='pause'&&resume()):pause();}
  const k=KEYS[e.key];if(!k||e.target.closest('button'))return;e.preventDefault();if(!live())return;
  if(k==='down'){if(!e.repeat){holds.set('k',{down:true});B.soft(G,true);}}
  else if(k==='left'||k==='right')keys[k]();
  else if(!e.repeat)keys[k]();});
addEventListener('keyup',e=>{if(KEYS[e.key]==='down'){holds.delete('k');if(G)B.soft(G,false);}});
addEventListener('resize',()=>{if(view==='play')fit();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(view==='play')fit();else render();});
addEventListener('blur',pause);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();Profiles.flush();}else if(Profiles.online&&Profiles.account()&&view==='start')Profiles.connect();});
document.fonts?.ready.then(()=>{if(view!=='play')render();});
render();Profiles.connect();
})();
</script>
</body>
