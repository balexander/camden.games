<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Bricks</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111728" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* One screen at a time: start (play, levels, options), the brick field, the level's summary, a question, or the shelf of boosts.
   The field keeps its 360 by 600 shape and grows to fit the screen. */
body{overscroll-behavior:none}
body.playing{overflow:hidden;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.center{align-items:center;text-align:center}
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:none;vertical-align:-.18em}
.big{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:1.3rem;color:var(--soft)}

/* start */
.next{display:flex;gap:14px;align-items:center}
.next svg.pic{width:118px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--card)}
.btn.go{font-size:1.35rem;padding:14px 26px}
.world{display:flex;flex-direction:column;gap:8px}
.world h3{display:flex;gap:8px;align-items:center}
.world h3 .dots{display:flex;gap:3px}.world h3 .dots i{width:10px;height:10px;border-radius:3px}
.world.locked h3{color:var(--soft)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvls button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:800 1.3rem/1 var(--display)}
.lvls button:active{transform:translateY(3px);box-shadow:none}
.lvls button.now{border-color:var(--blue);background:var(--blue-wash)}
.lvls button:disabled{opacity:.5;box-shadow:none;color:var(--soft);cursor:default}
.st3{display:flex;gap:1px;font-size:.72rem;color:var(--line)}.st3 .on{color:var(--star)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:700;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* the field */
#app.play{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));gap:6px;padding-block:8px;max-width:none;align-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.hud{width:100%;max-width:760px;display:flex;flex-direction:column;gap:4px;flex:none}
.hud .top{display:flex;gap:10px;align-items:center;height:46px}
.hud .lv{display:flex;flex-direction:column;line-height:1.1;overflow:hidden;white-space:nowrap}
.hud .lv b{font:800 1.15rem/1.1 var(--display)}.hud .lv small{color:var(--soft);font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.hud .stat{font-size:1.25rem}
#lives{display:flex;gap:1px;color:#e0364a;font-size:1.05rem}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:1.2rem;flex:none}
.hud .fx{display:flex;gap:6px;align-items:center;height:30px}
.chip{display:inline-flex;gap:4px;align-items:center;height:28px;padding:0 9px 0 7px;border-radius:999px;background:var(--c);color:#fff;font:800 .95rem var(--display);font-variant-numeric:tabular-nums}
.chip.low{animation:blink .5s steps(2) infinite}@keyframes blink{50%{opacity:.45}}
#combo{margin-left:auto;font:800 1.25rem var(--display);color:var(--amber);padding:0 4px}
#combo.pop{animation:pop .3s}@keyframes pop{40%{transform:scale(1.6)}}
.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;position:relative}
.wrap{position:relative;flex:none}
canvas{display:block;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.banner{position:absolute;left:0;right:0;top:45%;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none;padding:14px 10px;background:color-mix(in srgb,var(--card) 86%,transparent);border-block:3px solid var(--c,var(--blue));animation:slide .45s cubic-bezier(.2,1.4,.4,1);transition:opacity .25s,transform .25s}
.banner.out{opacity:0;transform:scale(.9)}
.banner small{font:800 .95rem var(--display);color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.banner b{font:800 clamp(1.7rem,8vw,2.4rem)/1.05 var(--display);color:var(--c,var(--blue))}
@keyframes slide{from{opacity:0;transform:translateX(-30%)}}
.hint{height:28px;line-height:28px;flex:none}
.pause{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 78%,transparent);padding:16px}
.pause .sheet{width:min(320px,100%)}.pause .btn{text-align:center}

/* level end */
.stars3{display:flex;gap:8px;font-size:3.6rem;color:var(--line)}
.stars3 span.on{color:var(--star);animation:starin .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*.28s)}
@keyframes starin{from{transform:scale(0) rotate(-90deg);color:var(--line)}}

/* the questions */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)} .dots i.no{background:var(--miss);border-color:var(--miss)} .dots i.now{border-color:var(--blue)}
.q{font:800 clamp(2.4rem,11vw,3.4rem)/1.1 var(--display);font-variant-numeric:tabular-nums}
.q .slot{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--blue);color:var(--blue)}
.q.word{font-size:clamp(1.9rem,9vw,2.6rem)}
.fix{background:var(--miss-wash);border-color:var(--miss)} .good{background:var(--good-wash);border-color:var(--good)}
.shake{animation:shake .3s} @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:800 1.7rem var(--display);height:clamp(46px,8.5vh,64px);border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:none;background:var(--blue-wash)}
.pad .alt{font-size:1rem;color:var(--soft)}
.choices{display:grid;gap:8px}
.choices button{font-weight:700;font-size:1.05rem;text-align:left;padding:12px 14px;min-height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.choices button:active{transform:translateY(3px);box-shadow:none;background:var(--blue-wash)}
.choices button.right{border-color:var(--good);background:var(--good-wash)}

/* the shelf */
.pips{display:flex;gap:8px;justify-content:center;font-size:2rem;color:var(--line)}
.pips span.on{color:var(--star)} .pips span.used{color:var(--good)}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.boost{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;min-height:128px;border-radius:18px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);animation:deal .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*.07s)}
@keyframes deal{from{opacity:0;transform:translateY(24px) scale(.8)}}
.boost .disc{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.7rem}
.boost b{font:800 1.1rem/1.1 var(--display)}
.boost:active{transform:translateY(3px);box-shadow:none}
.boost[aria-pressed="true"]{border-color:var(--good);background:var(--good-wash);box-shadow:0 4px 0 var(--good);animation:picked .3s}
@keyframes picked{40%{transform:scale(1.08) rotate(-2deg)}}
.boost[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--good);color:var(--card);font:800 1rem/26px var(--body)}
.shelf.full .boost[aria-pressed="false"]:not(:disabled){opacity:.55}
.boost:disabled{opacity:.6;box-shadow:none;cursor:default}.boost:disabled .disc{background:var(--line);color:var(--soft)}
@media (prefers-reduced-motion:reduce){.shake,.boost,.boost[aria-pressed="true"],.banner,.stars3 span.on,#combo.pop,.chip.low{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<script src="../shared/srs.js"></script>
<script src="../shared/words.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/profiles.js"></script>
<script src="game.js"></script>
<script>
// Brain Bricks, the page. Bricks (game.js) runs the ball, bricks, capsules and boosts; this file draws its state, turns its
// events into sounds and sparks, runs the questions between levels and the shelf where right answers are spent, and saves.
// Who is playing and what they know come from Profiles and the scheduler, shared with every other game.
(()=>{
const GAME='brain-bricks',B=Bricks,app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches,$=id=>document.getElementById(id);
if(!Profiles.me()){location.replace('../');return;}   // nobody picked yet: the home page asks who is playing
const p=()=>Profiles.me(),mine=()=>{const me=p();me.games[GAME]=B.clean(me.games[GAME]);return me.games[GAME];};
// view is the screen showing. S is the level in play, E what the summary says about it, Q the quiz, picks and chosen the shelf.
let view='start',S=null,E=null,Q=null,picks=0,chosen=[],carry=0,paused=false,raf=0,prev=0,endT=0,keys={};
Profiles.busyWith(()=>view==='start'?null:Profiles.db.cur);
Profiles.on(()=>{if(!p())location.replace('../');else if(view==='start')render();});

/* ---------- pictures: one set of shapes, used in the page as SVG and on the field as canvas paths ---------- */
const circ=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0z`;
const ICON={
  wide:'M1 12l6-6v4h10V6l6 6-6 6v-4H7v4z',
  multi:circ(12,6.5,4.5)+circ(6,17,4.5)+circ(18,17,4.5),
  ball:circ(8.5,14,7)+circ(18.5,6.5,4),
  slow:circ(12,12,10.5)+circ(12,12,7.8)+'M10.9 6.5h2.2v5l3.7 2.2-1.1 1.9-4.8-2.8z',
  laser:'M14 1L4 14h6l-2 9 12-14h-7z',
  magnet:'M3 2h6v10a3 3 0 0 0 6 0V2h6v10a9 9 0 0 1-18 0zM3 6h6v1.6H3zM15 6h6v1.6h-6z',
  fire:'M12 1c1 4.5 7 7 7 13a7 7 0 0 1-14 0c0-3.5 2.2-4.6 3-8 1.7 1 2.4 2.4 2.4 4C11.4 8 12 4.5 12 1z',
  shield:'M12 1l9 3.5V11c0 5.5-3.8 9.8-9 12-5.2-2.2-9-6.5-9-12V4.5z',
  life:'M12 22C4.5 15.5 1 12 1 7.8A5.6 5.6 0 0 1 12 5.6 5.6 5.6 0 0 1 23 7.8c0 4.2-3.5 7.7-11 14.2z',
  lock:'M6 10V7a6 6 0 0 1 12 0v3h2v12H4V10zm3 0h6V7a3 3 0 0 0-6 0z',
  star:'M12 1.5l3.1 6.9 7.5.8-5.6 5 1.6 7.4L12 17.8l-6.6 3.8L7 14.2l-5.6-5 7.5-.8z',
  pause:'M6 4h4.5v16H6zM13.5 4H18v16h-4.5z',
};
// Each capsule and boost has its own colour as well as its own shape.
const TINT={wide:'#3d7be0',multi:'#8f6ce0',ball:'#8f6ce0',slow:'#1f97a8',shield:'#3f9a47',laser:'#d6478f',magnet:'#b8860b',fire:'#e8641e',life:'#e0364a'};
const svg=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="${ICON[k]}"/></svg>`;
const PATH={};for(const k in ICON)PATH[k]=new Path2D(ICON[k]);

/* ---------- sound: short beeps made on the spot ---------- */
// iPhones and iPads only allow sound that starts from a touch, so the first touch wakes the sound up; later beeps come from the game loop.
let actx=null,hiss=null;const last={};
const loud=()=>!!p()?.set.sound&&actx&&actx.state==='running';
function wake(){if(!p()?.set.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch{}}
function tone(f,d,o={}){
  if(!loud())return;
  try{const t=actx.currentTime+(o.at||0),osc=actx.createOscillator(),g=actx.createGain();osc.type=o.type||'triangle';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d);g.gain.setValueAtTime(o.gain||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    osc.connect(g).connect(actx.destination);osc.start(t);osc.stop(t+d+.02);}catch{}
}
// A burst of hiss through a closing filter: the body of an explosion or a whoosh.
function noise(d,o={}){
  if(!loud())return;
  try{if(!hiss){hiss=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const a=hiss.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const t=actx.currentTime+(o.at||0),src=actx.createBufferSource(),flt=actx.createBiquadFilter(),g=actx.createGain();src.buffer=hiss;flt.type='lowpass';
    flt.frequency.setValueAtTime(o.f||900,t);flt.frequency.exponentialRampToValueAtTime(o.to||100,t+d);g.gain.setValueAtTime(o.gain||.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    src.connect(flt).connect(g).connect(actx.destination);src.start(t);src.stop(t+d+.02);}catch{}
}
const beep=(notes,o={})=>{let at=o.at||0;for(const [f,d] of notes){tone(f,d,{...o,at});at+=d*.8;}};
// Some things happen many times in one frame (a bomb chain, a ball rattling in a gap); each kind of sound waits its turn.
const gate=(name,ms)=>{const n=performance.now();if(n-(last[name]||0)<ms)return false;last[name]=n;return true;};
const SCALE=[0,2,4,7,9];   // a combo climbs a five-note scale, so it always sounds like a tune
const sfx={
  wall:()=>gate('wall',70)&&tone(240,.03,{type:'sine',gain:.05}),
  paddle:()=>tone(330,.06),serve:()=>tone(392,.08,{to:587}),
  hit:()=>gate('hit',40)&&tone(415,.05,{type:'square',gain:.05}),
  steel:()=>{if(gate('steel',90)){tone(1568,.05,{type:'square',gain:.03});tone(2093,.09,{type:'sine',gain:.04});}},
  brk:c=>{if(!gate('brk',28))return;const i=Math.min(c-1,12);tone(523.25*2**((12*Math.floor(i/5)+SCALE[i%5])/12),.09,{gain:.09});},
  boom:()=>{if(!gate('boom',90))return;noise(.5,{f:1200,to:70,gain:.4});tone(150,.45,{type:'sine',to:36,gain:.35});},
  drop:()=>gate('drop',120)&&tone(988,.14,{type:'sine',to:659,gain:.06}),
  shoot:()=>gate('shoot',200)&&tone(1100,.06,{type:'sawtooth',to:500,gain:.03}),
  stick:()=>tone(196,.07,{type:'square',gain:.06}),release:()=>tone(294,.07,{to:440}),
  expire:()=>beep([[494,.07],[370,.1]],{type:'sine',gain:.06}),
  saved:()=>beep([[440,.08],[660,.12]]),drain:()=>tone(260,.1,{to:180,gain:.06}),
  lost:()=>beep([[300,.12],[200,.22]]),over:()=>beep([[330,.12],[262,.12],[196,.3]]),
  won:()=>{beep([[523,.09],[659,.09],[784,.09],[1047,.22]]);beep([[1319,.07],[1568,.07],[2093,.2]],{at:.42,type:'sine',gain:.06});},
  pick:()=>beep([[659,.06],[988,.1]]),unpick:()=>tone(392,.07),no:()=>tone(196,.1,{type:'square',gain:.05}),
  star:i=>tone([659,784,1047][i]||659,.16,{type:'sine',gain:.12}),
  // one sound for each capsule, so he hears what he caught
  wide:()=>beep([[262,.1],[392,.1],[523,.16]],{type:'square',gain:.06}),
  multi:()=>beep([[784,.05],[988,.05],[1175,.05],[784,.05],[988,.05],[1175,.1]],{gain:.08}),
  slow:()=>tone(660,.5,{type:'sine',to:220,gain:.12}),
  laser:()=>{tone(1500,.18,{type:'sawtooth',to:250,gain:.07});tone(1500,.18,{type:'sawtooth',to:250,gain:.07,at:.12});},
  magnet:()=>beep([[220,.07],[330,.07],[220,.07],[330,.07],[220,.12]],{type:'square',gain:.05}),
  fire:()=>{noise(.4,{f:300,to:3000,gain:.2});tone(330,.35,{type:'sawtooth',to:990,gain:.06});},
  shield:()=>beep([[523,.12],[523,.12],[784,.2]],{type:'sine',gain:.12}),
  life:()=>beep([[659,.08],[784,.08],[1047,.08],[1319,.24]]),
};

/* ---------- screens ---------- */
function render(){
  app.className=view;document.body.classList.toggle('playing',view==='play');
  app.innerHTML={start:startView,play:playView,end:endView,quiz:quizView,shelf:shelfView}[view]();
  if(view==='play')setupField();
}
const stars3=n=>`<span class="st3" aria-label="${n} of 3 stars">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}">${svg('star')}</span>`).join('')}</span>`;
// A small picture of a level, drawn from the same bricks the game uses.
function picture(n){
  const ks=B.level(n),cs=B.world(n).colors,h=8*(B.BRICK_H+B.GAP)+8;   // room for the tallest picture, so every level's picture is the same size
  return `<svg class="pic" viewBox="0 ${B.TOP-6} ${B.W} ${h}" aria-hidden="true">${ks.map(k=>`<rect x="${k.x}" y="${k.y}" width="${k.w}" height="${k.h}" rx="4" fill="${k.kind==='steel'?'#8f98a8':k.kind==='bomb'?'#d9342b':esc(cs[k.row%cs.length])}"${k.kind==='power'?' stroke="#ffc93c" stroke-width="5"':''}/>`).join('')}</svg>`;
}
function startView(){
  const me=p(),g=mine(),w=B.world(g.level),got=Object.values(g.stars).reduce((a,b)=>a+b,0),laps=B.world(g.top).lap,worlds=[];
  for(let lap=0;lap<=laps;lap++)for(let i=0;i<B.WORLDS.length;i++)worlds.push(B.world(lap*B.PICTURES.length+B.WORLDS[i].first));
  const seg=(act,cur,list)=>`<div class="seg" role="group">${list.map(([v,name])=>`<button data-act="${act}" data-v="${v}" aria-pressed="${cur===v}">${name}</button>`).join('')}</div>`;
  return `<header class="row"><a class="btn ghost" href="../">← Games</a><h2 class="grow">Brain Bricks</h2><span class="stat"><span class="star">${svg('star')}</span> ${got}</span></header>
    <div class="sheet col">
      <div class="next">${picture(g.level)}<div class="col grow"><p class="soft">${esc(me.av||'🦊')} ${esc(me.name)}</p><h1>Level ${g.level}</h1><p class="soft">${esc(w.name)}</p></div></div>
      <button class="btn go" data-act="play">${g.level>1?'Keep going':'Play'}</button>
      <p class="small soft center">Best score ${g.best}</p></div>
    <div class="sheet col"><h2>Levels</h2>${worlds.map(x=>{const open=x.first<=g.top;
      return `<section class="world ${open?'':'locked'}"><h3>${open?`<span class="dots">${x.colors.slice(0,4).map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</span>`:svg('lock')}<span class="grow">${esc(x.name)}${x.lap?` · Lap ${x.lap+1}`:''}</span></h3>
        ${open?`<div class="lvls">${[0,1,2,3,4].map(i=>{const n=x.first+i,ok=n<=g.top;
          return `<button data-act="level" data-v="${n}" class="${n===g.level?'now':''}" ${ok?'':'disabled'} aria-label="Level ${n}${ok?'':', locked'}">${ok?`${n}${stars3(g.stars[n]||0)}`:svg('lock')}</button>`;}).join('')}</div>`:''}</section>`;}).join('')}</div>
    <div class="sheet col"><h2>Options</h2><div class="opt">
      <span>Questions</span>${seg('subject',g.subject,[['math','Math'],['words','Words']])}
      <span>Ball</span>${seg('speed',g.speed,[['chill','Chill'],['normal','Normal'],['fast','Fast']])}
      <span>Sound</span>${seg('sound',me.set.sound?'on':'off',[['on','On'],['off','Off']])}</div>
      <p class="small soft">Drag to aim each shot. Slide to move. After each level, ${B.QUIZ} questions: each right answer is a boost for the next level.</p></div>`;
}
function playView(){
  const w=B.world(S.level),first=S.level===w.first;
  return `<div class="hud"><div class="top"><button class="ib" data-act="pause" aria-label="Pause">${svg('pause')}</button>
      <span class="lv grow"><b>Level ${S.level}</b><small>${esc(w.name)}</small></span><span class="stat" id="score">${S.score}</span><span id="lives" aria-label="Lives"></span></div>
    <div class="fx"><span id="fx" class="row" style="gap:6px;flex-wrap:nowrap"></span><span id="combo" aria-live="off"></span></div></div>
    <div class="stage"><div class="wrap"><canvas id="field" aria-label="Brick field. Each serve is aimed: drag to aim and let go to shoot. Then slide to move the paddle."></canvas>

    scale=Math.max(.3,Math.min(Math.min(stage.clientWidth-4,760)/B.W,(stage.clientHeight-36)/B.H));const dpr=Math.min(devicePixelRatio||1,3);

    for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],len=Math.hypot(b.x-a.x,b.y-a.y);
      for(;d<len;d+=GAPD){g.globalAlpha=.6;dot(a.x+(b.x-a.x)*d/len,a.y+(b.y-a.y)*d/len,2.4);}d-=len;}
    g.globalAlpha=.85;g.strokeStyle=K.blue;g.lineWidth=2;g.beginPath();g.arc(end.x,end.y,B.BALL_R,0,6.2832);g.stroke();g.globalAlpha=1;
  }
  for(const b of S.balls){
    if(b.stuck&&!S.serving){   // held by the magnet: a ring, and dots that show where it will go
      const a=Math.max(-1,Math.min(1,b.off/(pd.w/2)))*1.05;g.fillStyle=TINT.magnet;for(let i=1;i<=5;i++){g.globalAlpha=1-i*.15;dot(b.x+Math.sin(a)*i*13,b.y-Math.cos(a)*i*13,2);}
      g.globalAlpha=1;g.strokeStyle=TINT.magnet;g.lineWidth=2;g.beginPath();g.arc(b.x,b.y,B.BALL_R+3+Math.sin(t*10),0,6.2832);g.stroke();}
    if(b.fire){g.fillStyle='rgba(255,120,30,.35)';dot(b.x,b.y,B.BALL_R+4+Math.sin(t*20+b.x));g.fillStyle='#ff6a1a';dot(b.x,b.y,B.BALL_R+1);g.fillStyle='#ffe066';dot(b.x,b.y,B.BALL_R-2);}
    else{g.fillStyle=K.ink;dot(b.x,b.y,B.BALL_R);g.fillStyle=K.card;g.globalAlpha=.55;dot(b.x-1.8,b.y-1.8,1.9);g.globalAlpha=1;}
  }
  for(const k of parts){
    const f=Math.max(0,k.life/k.max);g.globalAlpha=Math.min(1,f*1.6);
    if(k.t==='bit'){g.fillStyle=k.c;g.fillRect(k.x-k.size/2,k.y-k.size/2,k.size,k.size);}
    else if(k.t==='conf'){g.fillStyle=k.c;g.save();g.translate(k.x,k.y);g.rotate(k.spin+k.life*7);g.fillRect(-k.size/2,-k.size/4,k.size,k.size/2);g.restore();}
    else if(k.t==='ring'){g.strokeStyle=k.c;g.lineWidth=1+5*f;g.beginPath();g.arc(k.x,k.y,k.size*(1-f)+4,0,6.2832);g.stroke();}
    else if(k.t==='ghost'){g.fillStyle=k.c;rr(k.x-B.BRICK_W/2-2*(1-f),k.y-B.BRICK_H/2-2*(1-f),B.BRICK_W+4*(1-f),B.BRICK_H+4*(1-f),4);g.fill();}
    else{g.font=`800 ${k.size}px "Baloo 2",system-ui,sans-serif`;g.textAlign='center';g.lineWidth=3;g.strokeStyle=K.card;g.strokeText(k.text,k.x,k.y);g.fillStyle=k.c;g.fillText(k.text,k.x,k.y);}
  }
  g.globalAlpha=1;g.textAlign='center';
  const big=(text,y,size,c,a=1)=>{g.globalAlpha=a;g.font=`800 ${size}px "Baloo 2",system-ui,sans-serif`;g.lineWidth=5;g.strokeStyle=K.card;g.strokeText(text,B.W/2,y);g.fillStyle=c;g.fillText(text,B.W/2,y);g.globalAlpha=1;};
  if(pop){const f=pop.life/.7;big(pop.text,B.H*.66,calm?44:44+(1-f)*26,K.amber,Math.min(1,f*1.5)*.85);}
  if(glare>0&&!calm){g.fillStyle=`rgba(255,255,255,${glare*2.5})`;g.fillRect(-20,-20,B.W+40,B.H+40);}
  if(S.serving&&!S.over){g.globalAlpha=.75+.25*Math.sin(t*4);g.fillStyle=K.soft;g.font='700 18px Nunito,system-ui,sans-serif';g.lineWidth=4;g.strokeStyle=K.card;g.lineJoin='round';
    const hint=S.aimable?'Drag to aim, let go to shoot':'Tap to launch',hy=S.aimable?B.PADDLE_Y+34:B.PADDLE_Y-34;g.strokeText(hint,B.W/2,hy);g.fillText(hint,B.W/2,hy);g.globalAlpha=1;}
  if(S.over==='won'){const f=Math.min(1,((calm?1.2:1.8)-endT)/.3);big('Level clear!',B.H*.5,calm?40:26+14*f,K.blue,f);}
  g.restore();
}
function levelOver(){
  if(view!=='play')return;cancelAnimationFrame(raf);
  const me=p(),was=mine(),total=S.bricks.filter(k=>k.kind!=='steel').length;
  E={won:S.over==='won',stars:B.stars(S),best:S.score>was.best&&was.best>0,total,broke:total-B.left(S)};
  me.games[GAME]=B.record(was,S);Profiles.save(me);carry=E.won?S.score:0;
  view='end';render();
  for(let i=0;i<E.stars;i++)setTimeout(()=>{if(view==='end')sfx.star(i);},280*(i+1)+200);
}

/* ---------- the questions between levels ---------- */
function startQuiz(){
  const me=p(),g=mine(),o={stretch:me.set.stretch,custom:Profiles.db.words,range:me.set.range};
  Q={won:E.won,n:0,right:0,total:B.QUIZ,again:false,marks:[],recent:[],newHard:0,order:me.set.order,deck:Core.deck(g.subject==='words'?'vmix':'mix',o,me.cards)};
  view='quiz';nextQ();
}
function nextQ(){
  if(Q.n>=Q.total){picks=Math.min(B.QUIZ,Q.right,B.shelf(mine().top).filter(b=>b.unlocked).length);chosen=[];view='shelf';beep(picks?[[523,.09],[659,.09],[784,.16]]:[[392,.12]]);render();return shelfMarks();}
  const me=p(),pick=SRS.pick(me.cards,Q.deck,Q,Date.now()),f=pick.fact,flip=(f.op==='add'||f.op==='mul')&&Math.random()<.5,lvl=SRS.view(me.cards[f.key]).level;
  Q.recent=[...Q.recent,f.key].slice(-Math.min(2,Q.deck.length-1));
  Q.cur={fact:f,due:pick.due,isNew:pick.isNew,x:flip?f.b:f.a,y:flip?f.a:f.b,typed:'',phase:'ask',t0:performance.now(),mn:Core.mnemonic(f),shake:false,
    hint:me.set.hints==='always'||(me.set.hints==='fade'&&lvl<3),choices:f.kind==='vocab'?Core.choices(f,[...Q.deck,...Core.items('v1'),...Core.items('v2')]):null};
  render();
}
function quizView(){
  const c=Q.cur,f=c.fact,word=f.kind==='vocab',fix=c.phase==='fix',good=c.phase==='good';
  const dots=`<div class="dots" aria-label="Question ${Math.min(Q.n+1,Q.total)} of ${Q.total}">${Array.from({length:Q.total},(_,i)=>`<i class="${Q.marks[i]===true?'ok':Q.marks[i]===false?'no':i===Q.n?'now':''}"></i>`).join('')}</div>`;
  const ask=word?`<div class="q word">${esc(f.w)}</div><p class="soft">${fix?`means <b>${esc(f.def)}</b>`:'What does it mean?'}</p>`
    :`<div class="q">${esc(c.x)} ${esc(Core.OPS[f.op].sym)} ${esc(c.y)} = <span class="slot ${c.shake?'shake':''}">${fix&&!c.typed?'':esc(c.typed)||'&nbsp;'}</span></div>${fix?`<p>The answer is <b>${esc(f.ans)}</b>. Type it to go on.</p>`:''}`;
  const trick=fix?c.mn.reveal:c.hint?c.mn.hint:'';
  return `<header class="col center"><h2>Boost time</h2><p class="soft">Every right answer earns a boost.</p>${dots}</header>
    <div class="sheet col center ${fix?'fix':good?'good':''}">${ask}${trick?`<p class="small soft">${esc(trick)}</p>`:''}</div>
    ${word?`<div class="choices">${c.choices.map((d,i)=>`<button data-act="choose" data-v="${i}" class="${(fix||good)&&d===f.def?'right':''}">${esc(d)}</button>`).join('')}</div>${fix?'<div class="row" style="justify-content:center"><button class="btn" data-act="next">Got it</button></div>':''}`
      :`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join('')}<button class="alt" data-act="key" data-v="skip">${fix?'':'Not sure'}</button><button data-act="key" data-v="0">0</button><button class="alt" data-act="key" data-v="back" aria-label="Delete">⌫</button></div>`}`;
}
function answer(ok){
  const me=p(),c=Q.cur,f=c.fact,ms=performance.now()-c.t0;if(c.phase!=='ask')return;
  me.cards[f.key]=SRS.review(me.cards[f.key],{ok,ms,fastMs:Core.fastMs(f),due:c.due},Date.now());
  if(c.isNew&&(!ok||ms>Core.fastMs(f)))Q.newHard++;
  Q.marks[Q.n]=ok;if(ok){if(Q.n<B.QUIZ)Q.right++;me.stars++;}
  else if(!Q.again){Q.again=true;Q.total++;}   // one miss adds one more question, so the missed card can come back before the level starts
  Q.n++;Profiles.save(me);
  if(ok){c.phase='good';beep([[660,.08],[880,.12]]);render();setTimeout(()=>{if(view==='quiz'&&Q.cur===c)nextQ();},f.kind==='vocab'?900:650);}
  else{c.phase='fix';c.typed='';beep([[220,.18]]);render();}
}
function key(v){
  if(view!=='quiz'||Q.cur.fact.kind==='vocab')return;const c=Q.cur,want=String(c.fact.ans);c.shake=false;
  if(c.phase==='good')return;
  if(v==='back'){c.typed=c.typed.slice(0,-1);return render();}
  if(v==='skip'){if(c.phase==='ask')answer(false);return;}
  if(c.typed.length>=want.length)return;
  c.typed+=v;
  if(c.phase==='fix'){if(c.typed===want)return nextQ();if(c.typed.length>=want.length){c.typed='';c.shake=true;}return render();}
  if(c.typed.length>=want.length)return answer(c.typed===want);
  render();
}

/* ---------- buttons and keys ---------- */
// Starts level n with the boosts picked from the shelf. The score carries on from a level just won.
function begin(n,boosts){const g=mine();S=B.start(n,{boosts,speed:g.speed,score:carry,top:g.top});carry=0;view='play';render();}
const option=(k,v)=>{mine()[k]=v;Profiles.save(p());render();};
const acts={
  play:()=>{carry=0;begin(mine().level,[]);},
  level:v=>{const n=Math.floor(+v),g=mine();if(n>=1&&n<=g.top){carry=0;begin(n,[]);}},
  go:()=>begin(mine().level,chosen.splice(0)),
  subject:v=>option('subject',v==='words'?'words':'math'),
  speed:v=>option('speed',Object.hasOwn(B.SPEEDS,v)?v:'normal'),
  sound:v=>{const me=p();me.set.sound=v==='flip'?!me.set.sound:v==='on';Profiles.save(me);wake();if(view==='play')$('snd').textContent='Sound: '+(me.set.sound?'on':'off');else render();tone(659,.08);},
  pause:()=>setPause(true),resume:()=>setPause(false),
  quit:()=>{cancelAnimationFrame(raf);const me=p();me.games[GAME]=B.record(mine(),S);Profiles.save(me);paused=false;carry=0;view='start';render();},
  home:()=>{carry=0;view='start';render();},
  quiz:startQuiz,
  boost:v=>{const i=chosen.indexOf(v);
    if(i>=0){chosen.splice(i,1);sfx.unpick();}else if(chosen.length<picks&&B.shelf(mine().top).some(b=>b.id===v&&b.unlocked)){chosen.push(v);sfx.pick();}else{sfx.no();const el=$('pips');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
    shelfMarks();},
  key:v=>key(v),choose:v=>{const c=Q.cur;if(c.phase==='ask')answer(c.choices[v]===c.fact.def);},next:()=>{if(Q.cur.phase==='fix')nextQ();},
};
app.addEventListener('click',e=>{wake();const b=e.target.closest('[data-act]');if(b&&!b.disabled&&acts[b.dataset.act])acts[b.dataset.act](b.dataset.v);});
addEventListener('keydown',e=>{wake();if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(view==='play'){
    if(e.key==='Escape'||e.key==='p'||e.key==='P')return setPause(!paused);
    if(paused)return;keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault();
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)tap();}return;}
  if(view==='quiz'){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace'){e.preventDefault();key('back');}else if(Q.cur.choices&&/^[1-3]$/.test(e.key))acts.choose(e.key-1);else if(e.key==='Enter')acts.next();}});
addEventListener('keyup',e=>{keys[e.key]=false;});
// Nothing in play may scroll or zoom the page.
app.addEventListener('touchmove',e=>{if(view==='play'&&!paused)e.preventDefault();},{passive:false});
for(const t of ['gesturestart','dblclick'])document.addEventListener(t,e=>{if(view==='play')e.preventDefault();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause(true);Profiles.flush();prev=0;}else if(Profiles.online&&Profiles.account()&&view==='start')Profiles.connect();});
render();Profiles.connect();
})();
</script>
